<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="720" fill="#fff"/><rect x="65" y="140" width="350" height="380" rx="6" fill="#E7F1F1" stroke="#2F7E83" stroke-width="2"/><rect x="465" y="140" width="350" height="380" rx="6" fill="#FFFFFF" stroke="#4D1434" stroke-width="2"/><rect x="865" y="140" width="350" height="380" rx="6" fill="#F8EDE2" stroke="#9F541A" stroke-width="2"/><text x="240" y="222.48000000000002" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">CAMPO ACÚSTICO</text>
<text x="240" y="253.20000000000002" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
<text x="240" y="283.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">p(r,t)</text>
<text x="240" y="314.64" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">u(r,t)</text>
<text x="240" y="345.36" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">I(r,t)</text>
<text x="240" y="376.08000000000004" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
<text x="240" y="406.8" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">Dos puntos pueden tener</text>
<text x="240" y="437.52" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">valores diferentes.</text><text x="640" y="222.48000000000002" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">PRESIÓN ACÚSTICA</text>
<text x="640" y="253.20000000000002" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
<text x="640" y="283.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">p_total = p₀ + p</text>
<text x="640" y="314.64" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
<text x="640" y="345.36" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">p &gt; 0: sobrepresión</text>
<text x="640" y="376.08000000000004" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">p &lt; 0: rarefacción</text>
<text x="640" y="406.8" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
<text x="640" y="437.52" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">p_total sigue positiva.</text><text x="1040" y="237.84" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">DOS VELOCIDADES</text>
<text x="1040" y="268.56" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
<text x="1040" y="299.28" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">u: movimiento local</text>
<text x="1040" y="330" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E">c: avance de la onda</text>
<text x="1040" y="360.72" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" fill="#242A2E"></text>
