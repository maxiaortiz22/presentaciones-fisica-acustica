<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="720" fill="#fff"/><rect x="65" y="70" width="560" height="120" rx="6" fill="#FFFFFF" stroke="#2F7E83" stroke-width="2"/><rect x="65" y="220" width="560" height="120" rx="6" fill="#FBF8F2" stroke="#4D1434" stroke-width="2"/><rect x="65" y="370" width="560" height="120" rx="6" fill="#FFFFFF" stroke="#2F7E83" stroke-width="2"/><rect x="65" y="520" width="560" height="120" rx="6" fill="#FBF8F2" stroke="#4D1434" stroke-width="2"/><rect x="655" y="70" width="560" height="120" rx="6" fill="#FFFFFF" stroke="#2F7E83" stroke-width="2"/><rect x="655" y="220" width="560" height="120" rx="6" fill="#FBF8F2" stroke="#4D1434" stroke-width="2"/><rect x="655" y="370" width="560" height="120" rx="6" fill="#FFFFFF" stroke="#2F7E83" stroke-width="2"/><text x="345" y="115.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: u = c</text>
<text x="345" y="144.08" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: movimiento local ≠ propagación</text><text x="345" y="265.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: media cero = señal nula</text>
<text x="345" y="294.08000000000004" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: RMS puede ser distinto de cero</text><text x="345" y="415.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: RMS = pico/√2 siempre</text>
<text x="345" y="444.08000000000004" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: solo vale para una senoide</text><text x="345" y="565.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: sumar dB aritméticamente</text>
<text x="345" y="594.0799999999999" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: sumar magnitudes según el caso</text><text x="935" y="115.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: −6 dB siempre</text>
<text x="935" y="144.08" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: solo bajo modelo esférico válido</text><text x="935" y="265.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: reverberante = difuso</text>
<text x="935" y="294.08000000000004" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: difuso requiere más condiciones</text><text x="935" y="415.92" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">ERROR: dB = sonoridad</text>
<text x="935" y="444.08000000000004" text-anchor="middle" dominant-baseline="middle" font-family="Calibri,Arial,sans-serif" font-size="22" font-weight="400" fill="#242A2E">CORRECCIÓN: nivel físico ≠ percepción</text></svg>