<rect width="1280" height="720" fill="white"/>
<rect x="72" y="27" width="390" height="6" fill="#4D1434"/><rect x="472" y="27" width="390" height="6" fill="#903163"/><rect x="872" y="27" width="336" height="6" fill="#969FA7"/>
<text x="72" y="82" font-family="Calibri,Arial,sans-serif" font-size="40" font-weight="700" fill="#3D3D3D">Una razón en dB no es automáticamente dB SPL</text>
<rect id="panel_left" x="92" y="180" width="520" height="350" rx="10" fill="#F3E8EE" stroke="#4D1434" stroke-width="2"/>
<text x="352" y="227" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#4D1434">Razón entre presiones</text>
<text x="352" y="272" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">20 log₁₀(p₂/p₁)</text>
<text x="352" y="304" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">referencia: p₁</text>
<rect id="panel_right" x="668" y="180" width="520" height="350" rx="10" fill="#E7F1F1" stroke="#2F7E83" stroke-width="2"/>
<text x="928" y="227" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#2F7E83">Nivel de presión sonora</text>
<text x="928" y="272" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">20 log₁₀(p_rms/p_ref)</text>
<text x="928" y="304" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">p_ref declarado</text>
<text x="640" y="628" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="22" fill="#3D3D3D">Los cocientes son adimensionales; declarar siempre la referencia.</text>
<text x="72" y="690" font-family="Calibri,Arial,sans-serif" font-size="16" fill="#969FA7">Libro del curso (TEX/PDF), Unidad 6; brief y storyboard U06; elaboración propia.</text>
