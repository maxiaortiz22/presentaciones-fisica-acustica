<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3D3D3D"/></marker></defs>
<rect width="1280" height="720" fill="white"/>
<rect x="72" y="27" width="390" height="6" fill="#4D1434"/><rect x="472" y="27" width="390" height="6" fill="#903163"/><rect x="872" y="27" width="336" height="6" fill="#969FA7"/>
<text x="72" y="82" font-family="Calibri,Arial,sans-serif" font-size="40" font-weight="700" fill="#3D3D3D">La tensión cambia la probabilidad de apertura</text>
<rect id="panel_left" x="92" y="180" width="520" height="350" rx="10" fill="#F7F6F2" stroke="#969FA7" stroke-width="2"/>
<text x="352" y="227" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#3D3D3D">Menor tensión</text>
<text x="352" y="272" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">probabilidad menor</text>
<text x="352" y="304" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">corriente K⁺ menor</text>
<rect id="panel_right" x="668" y="180" width="520" height="350" rx="10" fill="#F3E8EE" stroke="#4D1434" stroke-width="2"/>
<text x="928" y="227" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#4D1434">Mayor tensión</text>
<text x="928" y="272" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">probabilidad mayor</text>
<text x="928" y="304" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">entrada de K⁺ mayor</text>
<text x="640" y="628" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="22" fill="#3D3D3D">Estados probabilísticos; no son un interruptor binario ni usan ecuación de Nernst.</text>
<text x="72" y="690" font-family="Calibri,Arial,sans-serif" font-size="16" fill="#969FA7">Libro del curso, secciones 6.7–6.9; Fettiplace (2017); elaboración conceptual propia.</text>
</svg>