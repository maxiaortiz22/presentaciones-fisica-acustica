<text x="72" y="82" font-family="Calibri,Arial,sans-serif" font-size="40" font-weight="700" fill="#3D3D3D">La vibración también deforma estructuras</text>
<rect id="panel_left" x="92" y="180" width="520" height="350" rx="10" fill="#F3E8EE" stroke="#4D1434" stroke-width="2"/>
<text x="352" y="227" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#4D1434">Cápsula coclear</text>
<text x="352" y="272" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">deformación</text>
<text x="352" y="304" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">presiones diferenciales</text>
<rect id="panel_right" x="668" y="180" width="520" height="350" rx="10" fill="#E7F1F1" stroke="#2F7E83" stroke-width="2"/>
<text x="928" y="227" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#2F7E83">Tejidos blandos</text>
<text x="928" y="272" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">transmiten vibración</text>
<text x="928" y="304" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">ruta complementaria</text>
<text x="640" y="628" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="22" fill="#3D3D3D">Figura conceptual; no está a escala.</text>
<text x="72" y="690" font-family="Calibri,Arial,sans-serif" font-size="16" fill="#969FA7">Libro del curso, sección de conducción ósea; Stenfelt (revisión citada en el capítulo); elaboración propia.</text>
