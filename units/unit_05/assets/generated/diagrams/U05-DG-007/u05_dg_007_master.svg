<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3D3D3D"/></marker></defs>
<rect width="1280" height="720" fill="white"/>
<rect x="72" y="27" width="390" height="6" fill="#4D1434"/><rect x="472" y="27" width="390" height="6" fill="#903163"/><rect x="872" y="27" width="336" height="6" fill="#969FA7"/>
<text x="72" y="78" font-family="Calibri,Arial,sans-serif" font-size="42" font-weight="700" fill="#3D3D3D">Los nombres espectrales no describen la misma relación</text>
<polyline points="330,202.5 347.5,202.5 347.5,202.5 365,202.5" fill="none" stroke="#3D3D3D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="615,202.5 632.5,202.5 632.5,202.5 650,202.5" fill="none" stroke="#3D3D3D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="900,202.5 917.5,202.5 917.5,202.5 935,202.5" fill="none" stroke="#3D3D3D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="425,480 470,480 470,480 515,480" fill="none" stroke="#3D3D3D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="765,480 810,480 810,480 855,480" fill="none" stroke="#3D3D3D" stroke-width="3" marker-end="url(#arrow)"/>
<rect id="fundamental" x="80" y="145" width="250" height="115" rx="12" fill="#E7F1F1" stroke="#2F7E83" stroke-width="2"/>
<text x="205" y="187" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#2F7E83">Fundamental</text>
<text x="205" y="234" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">f₀ = 1/T₀</text>
<rect id="harmonic" x="365" y="145" width="250" height="115" rx="12" fill="#F3E8EE" stroke="#4D1434" stroke-width="2"/>
<text x="490" y="187" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#4D1434">Armónico</text>
<text x="490" y="234" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">fₙ = n f₀</text>
<rect id="partial" x="650" y="145" width="250" height="115" rx="12" fill="#F7F6F2" stroke="#969FA7" stroke-width="2"/>
<text x="775" y="187" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#3D3D3D">Parcial</text>
<text x="775" y="234" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">armónico o no</text>
<rect id="overtone" x="935" y="145" width="250" height="115" rx="12" fill="#F8EDE2" stroke="#9F541A" stroke-width="2"/>
<text x="1060" y="187" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#9F541A">Sobretono</text>
<text x="1060" y="234" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">parcial sobre f₀</text>
<rect id="voice_source" x="175" y="420" width="250" height="120" rx="12" fill="#E7F1F1" stroke="#2F7E83" stroke-width="2"/>
<text x="300" y="462" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#2F7E83">Fuente</text>
<text x="300" y="509" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">armónicos</text>
<rect id="vocal_filter" x="515" y="420" width="250" height="120" rx="12" fill="#F3E8EE" stroke="#4D1434" stroke-width="2"/>
<text x="640" y="462" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#4D1434">Tracto vocal</text>
<text x="640" y="509" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">formantes</text>
<rect id="voice_output" x="855" y="420" width="250" height="120" rx="12" fill="#F8EDE2" stroke="#9F541A" stroke-width="2"/>
<text x="980" y="462" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="32" font-weight="700" fill="#9F541A">Salida</text>
<text x="980" y="509" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">señal filtrada</text>
<text x="640" y="625" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="30" fill="#3D3D3D">Formante ≠ armónico · figura conceptual; no está a escala.</text>
<text x="72" y="689" font-family="Calibri,Arial,sans-serif" font-size="16" fill="#969FA7">Libro del curso, secciones 5.5 y 5.6; aplicación fuente–filtro de voz.</text>
</svg>